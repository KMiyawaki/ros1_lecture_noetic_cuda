version: '3.8'
services:
  ros1_lecture_noetic_cuda_11.1.1:
    container_name: ros1_lecture_noetic_cuda_11.1.1
    image: kmiyawaki20/ros1_noetic_nvidia_cuda:11.1.1-devel-ubuntu20.04_lxde
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    user: "ubuntu"
    volumes:
      - ubuntu:/home/ubuntu
    ports:
      - "6080:80"
      - "5901:5901"
    environment:
      - USER=ubuntu
      - RESOLUTION=1280x800
      - TZ=Asia/Tokyo
    tty: true
    privileged: true

volumes:
  ubuntu:
